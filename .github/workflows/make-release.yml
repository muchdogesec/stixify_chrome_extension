name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Get version from manifest
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_ID=$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=v${VERSION}_${COMMIT_ID}" >> $GITHUB_OUTPUT
          echo "Extension version: v${VERSION}_${COMMIT_ID}"

      - name: Create extension zip
        run: |
          cd dist
          zip -r ../stixify-extension-${{ steps.get_version.outputs.version }}.zip .
          cd ..

      - name: Generate release notes
        id: release_notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## Stixify Chrome Extension ${{ steps.get_version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Built from commit: ${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Installation" >> $GITHUB_OUTPUT
          echo "1. Download the zip file" >> $GITHUB_OUTPUT
          echo "2. Extract the contents" >> $GITHUB_OUTPUT
          echo "3. Open Chrome and navigate to \`chrome://extensions/\`" >> $GITHUB_OUTPUT
          echo "4. Enable 'Developer mode'" >> $GITHUB_OUTPUT
          echo "5. Click 'Load unpacked' and select the extracted folder" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          files: stixify-extension-${{ steps.get_version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
